<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 610" role="img" aria-labelledby="title desc">
  <title id="title">성인이 돼도 끊어낼 수 없는 가족</title>
  <desc id="desc">거친 신문 인쇄 질감의 주황색과 아이보리색 한글 타이틀</desc>
  <defs>
    <style>
      @font-face {
        font-family: Pretendard;
        src: url('../fonts/PretendardVariable.woff2') format('woff2');
        font-weight: 900;
      }
      .title { font-family: Pretendard, 'Arial Black', sans-serif; font-weight: 900; letter-spacing: -9px; }
    </style>
    <filter id="rough" x="-4%" y="-6%" width="108%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.12" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="8" result="n"/>
      <feComposite in="n" in2="SourceGraphic" operator="in" result="texture"/>
      <feBlend in="SourceGraphic" in2="texture" mode="multiply"/>
    </filter>
  </defs>
  <g filter="url(#rough)">
    <text class="title" x="14" y="142" font-size="154" fill="#ff5a36">성인이 돼도</text>
    <text class="title" x="14" y="308" font-size="154" fill="#f3f0e7">끊어낼 수 없는</text>
    <text class="title" x="14" y="484" font-size="190" fill="#f3f0e7">가족</text>
  </g>
  <g opacity=".11" filter="url(#grain)">
    <rect x="0" y="0" width="920" height="610" fill="#151411"/>
  </g>
</svg>
