<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" role="img" aria-labelledby="title desc">
  <title id="title">성인이 돼도 끊어낼 수 없는 가족</title>
  <desc id="desc">검정 바탕 위 주황색 첫 줄과 아이보리색 굵은 글자, 연두색 밑줄로 구성한 신문 편집 타이틀</desc>
  <defs>
    <style>
      @font-face {
        font-family: Pretendard;
        src: url('../fonts/PretendardVariable.woff2') format('woff2');
        font-weight: 900;
      }
      .headline {
        font-family: Pretendard, 'Arial Black', sans-serif;
        font-weight: 900;
        letter-spacing: -11px;
        paint-order: stroke fill;
        stroke: #080807;
        stroke-width: 2.5px;
        stroke-linejoin: bevel;
      }
      .caption {
        font-family: Pretendard, sans-serif;
        font-weight: 900;
        letter-spacing: -2px;
      }
    </style>
    <filter id="print" x="-8%" y="-8%" width="116%" height="122%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.085" numOctaves="2" seed="19" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.25" xChannelSelector="R" yChannelSelector="G" result="rough"/>
      <feDropShadow dx="5" dy="7" stdDeviation="2.4" flood-color="#000000" flood-opacity=".9"/>
    </filter>
    <filter id="soft-glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <g filter="url(#print)">
    <text class="headline" x="18" y="137" font-size="139" fill="#ff4b27" textLength="682" lengthAdjust="spacingAndGlyphs">성인이 돼도</text>
    <text class="headline" x="18" y="295" font-size="134" fill="#f5efdf" textLength="718" lengthAdjust="spacingAndGlyphs">끊어낼 수 없는</text>
    <text class="headline" x="18" y="477" font-size="185" fill="#f5efdf" textLength="316" lengthAdjust="spacingAndGlyphs">가족</text>
  </g>

  <rect x="18" y="526" width="411" height="10" rx="5" fill="#b5d700" opacity=".42" filter="url(#soft-glow)"/>
  <rect x="18" y="524" width="411" height="8" rx="4" fill="#b8d900"/>
  <text class="caption" x="20" y="620" font-size="35" fill="#f5efdf" textLength="645" lengthAdjust="spacingAndGlyphs">복지 사각지대 놓인 탈가정 청년</text>
</svg>
